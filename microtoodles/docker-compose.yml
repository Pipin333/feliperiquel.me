services:
  microtoodles:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microtoodles_engine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/toodles_stream.db
    volumes:
      - microtoodles_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  microtoodles_data:
    driver: local
